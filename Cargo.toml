[package]
name = "semantic-search-agent"
version = "0.2.1"
edition = "2021"
description = "Industrial-grade WASM Multi-threaded Semantic Search Agent for 10,000+ files"
authors = ["DeepMind Pair Programmer <assistant@antigravity>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
unicode-normalization = "0.1"
regex = "1.10"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
