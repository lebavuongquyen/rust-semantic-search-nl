name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Verify Tests Before Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Test Suite
        run: cargo test --verbose

      - name: Verify WASM Target
        run: cargo check --target wasm32-unknown-unknown

      - name: TypeScript Contract Tests
        run: |
          npx --yes tsx ts/tests/provider-contract.test.ts
          npx --package typescript tsc --noEmit ts/*.ts ts/tests/*.ts

  build-native:
    name: Build Native Binaries (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: rust-semantic-search-nl-windows-x86_64.zip
            bin_source: target/release/search_cli.exe
            lib_source: target/release/semantic_search_agent.dll
          - os: ubuntu-latest
            artifact_name: rust-semantic-search-nl-linux-x86_64.tar.gz
            bin_source: target/release/search_cli
            lib_source: target/release/libsemantic_search_agent.so
          - os: macos-latest
            artifact_name: rust-semantic-search-nl-macos-x86_64.tar.gz
            bin_source: target/release/search_cli
            lib_source: target/release/libsemantic_search_agent.dylib
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Release
        run: cargo build --release --bin search_cli

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item ${{ matrix.bin_source }} dist/
          if (Test-Path ${{ matrix.lib_source }}) { Copy-Item ${{ matrix.lib_source }} dist/ }
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Unix Artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp ${{ matrix.bin_source }} dist/
          if [ -f "${{ matrix.lib_source }}" ]; then cp ${{ matrix.lib_source }} dist/; fi
          cp README.md dist/
          tar -czvf ${{ matrix.artifact_name }} -C dist .

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  build-wasm:
    name: Build WebAssembly Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129

      - name: Build WASM Binary
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Generate Web & Node.js Bindings
        run: |
          wasm-bindgen target/wasm32-unknown-unknown/release/semantic_search_agent.wasm --out-dir pkg-web --target web
          wasm-bindgen target/wasm32-unknown-unknown/release/semantic_search_agent.wasm --out-dir pkg-node --target nodejs
          zip -r rust-semantic-search-nl-wasm-web.zip pkg-web
          zip -r rust-semantic-search-nl-wasm-node.zip pkg-node

      - name: Upload WASM Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-semantic-search-nl-wasm-web.zip
          path: rust-semantic-search-nl-wasm-web.zip

      - name: Upload WASM Node Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-semantic-search-nl-wasm-node.zip
          path: rust-semantic-search-nl-wasm-node.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-native, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
